[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-coder"
version = "0.1.0"
description = "Verification-first components for autonomous coding loops"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Pretty Busy Solutions" }]

[tool.setuptools]
py-modules = [
  "agent_harness",
  "dream_consolidation",
  "security_monitor",
  "verification_specialist",
]
