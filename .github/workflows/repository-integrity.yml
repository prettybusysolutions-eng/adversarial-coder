name: Python integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests when present
        shell: bash
        run: |
          if find tests -type f -name 'test*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m unittest discover -s tests -v
          fi
