name: Python integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run required unit tests
        run: python -m unittest discover -s tests -v

      - name: Package tested source for local evaluation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evaluation"
          git rev-parse HEAD > "$RUNNER_TEMP/evaluation/COMMIT.txt"
          git archive --format=tar.gz --prefix=source/ HEAD > "$RUNNER_TEMP/evaluation/source.tar.gz"
          cd "$RUNNER_TEMP/evaluation"
          sha256sum source.tar.gz > SHA256SUMS
      - name: Upload evaluation bundle
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-${{ github.sha }}
          path: ${{ runner.temp }}/evaluation/
          if-no-files-found: error
          retention-days: 30
